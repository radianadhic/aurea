spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mdm_auth}
    username: ${DB_USERNAME:mdm_user}
    password: ${DB_PASSWORD:dev_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Jakarta
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/mdm-dev}
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/mdm-dev}/protocol/openid-connect/certs

server:
  port: ${SERVER_PORT:8081}
  compression:
    enabled: true
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002,http://localhost:3003}
  security:
    max-failed-attempts: 5
    lockout-duration-minutes: 15
    session-timeout-minutes: 30
    refresh-token-days: 7
    jwt:
      user-id-claim: sub
      username-claim: preferred_username
      roles-claim: realm_access.roles
      branch-id-claim: branch_id
      employee-id-claim: employee_id
  keycloak:
    realm: ${KEYCLOAK_REALM:mdm-dev}
    client-id: ${KEYCLOAK_CLIENT_ID:mdm-gateway}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    admin-username: ${KEYCLOAK_ADMIN:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

logging:
  level:
    com.bankxyz.mdm: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId:-},userId=%X{userId:-}] %logger{36} - %msg%n"
