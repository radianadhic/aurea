[project]
name = "mdm-ml-service"
version = "1.0.0"
description = "ML service for customer predictions (churn, risk, segmentation, anomaly detection)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Bank XYZ Internal" }
authors = [
  { name = "MDM Team", email = "mdm@bankxyz.co.id" }
]
dependencies = [
  "fastapi==0.110.0",
  "uvicorn[standard]==0.27.1",
  "pydantic==2.6.1",
  "pydantic-settings==2.2.1",
  "sqlalchemy==2.0.27",
  "asyncpg==0.29.0",
  "psycopg2-binary==2.9.9",
  "redis==5.0.1",
  "aiokafka==0.10.0",
  "python-multipart==0.0.9",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "httpx==0.27.0",
  "numpy==1.26.4",
  "pandas==2.2.0",
  "scikit-learn==1.4.1.post1",
  "joblib==1.3.2",
  "xgboost==2.0.3",
  "onnxruntime==1.17.0",
  "prometheus-client==0.20.0",
  "opentelemetry-api==1.23.0",
  "opentelemetry-sdk==1.23.0",
  "opentelemetry-instrumentation-fastapi==0.44b0",
  "opentelemetry-instrumentation-sqlalchemy==0.44b0",
  "opentelemetry-exporter-otlp==1.23.0",
  "structlog==24.1.0",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.0.0",
  "pytest-asyncio==0.23.5",
  "pytest-cov==4.1.0",
  "httpx==0.27.0",
  "mypy==1.8.0",
  "ruff==0.2.0",
  "black==24.1.1",
]

[tool.poetry]
name = "mdm-ml-service"
version = "1.0.0"
description = "ML service for customer predictions"
authors = ["MDM Team <mdm@bankxyz.co.id>"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=app --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
