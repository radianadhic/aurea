spring:
  application:
    name: workflow-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mdm_workflow}
    username: ${DB_USER:mdm}
    password: ${DB_PASSWORD:mdm123}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

# Camunda
camunda.bpm:
  admin-user:
    id: admin
    password: ${CAMUNDA_ADMIN_PASSWORD:admin}
    first-name: Admin
    last-name: User
  filter:
    create: All tasks
  database:
    schema-update: true
  auto-deployment-enabled: true

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

mdm:
  kafka:
    topics:
      workflow: mdm.workflow.events

logging:
  level:
    com.bankxyz.mdm: INFO
    org.camunda: WARN
