<!DOCTYPE html>
<html lang="id" data-theme="bankxyz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETL Display Preferences - MDM Admin</title>
    <link rel="stylesheet" href="../../styles/main.css" />
  </head>
  <body class="bg-base-200" x-data="etlDisplayPage()" x-init="init()">
    <div class="mb-6">
      <h1 class="text-2xl font-bold">ETL Display Preferences</h1>
      <p class="text-sm text-gray-500">Configure how ETL jobs, flows, and data lineage are displayed</p>
    </div>

    <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
      <!-- Display Settings -->
      <div class="card bg-base-100 shadow-md">
        <div class="card-body">
          <h3 class="card-title text-base">Display Settings</h3>

          <div class="form-control">
            <label class="form-label">Default Page Size</label>
            <select class="form-input" x-model="prefs.pageSize">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>

          <div class="form-control">
            <label class="form-label">Default Sort Order</label>
            <select class="form-input" x-model="prefs.sortOrder">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>
          </div>

          <div class="form-control">
            <label class="form-label">Date Format</label>
            <select class="form-input" x-model="prefs.dateFormat">
              <option value="DD/MM/YYYY">DD/MM/YYYY (26/08/2026)</option>
              <option value="YYYY-MM-DD">YYYY-MM-DD (2026-08-26)</option>
              <option value="MMM DD, YYYY">Aug 26, 2026</option>
            </select>
          </div>

          <div class="form-control">
            <label class="form-label">Timezone</label>
            <select class="form-input" x-model="prefs.timezone">
              <option value="Asia/Jakarta">Asia/Jakarta (WIB)</option>
              <option value="Asia/Makassar">Asia/Makassar (WITA)</option>
              <option value="Asia/Jayapura">Asia/Jayapura (WIT)</option>
            </select>
          </div>

          <div class="form-control">
            <label class="form-label">Number Format</label>
            <select class="form-input" x-model="prefs.numberFormat">
              <option value="id-ID">1.234.567,89 (Indonesian)</option>
              <option value="en-US">1,234,567.89 (US)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Data Refresh -->
      <div class="card bg-base-100 shadow-md">
        <div class="card-body">
          <h3 class="card-title text-base">Data Refresh Settings</h3>

          <div class="form-control">
            <label class="form-label">Auto Refresh (seconds)</label>
            <input type="number" class="form-input" x-model.number="prefs.autoRefresh" min="0" max="3600" />
            <p class="text-xs text-gray-500 mt-1">0 = disabled, max 3600 (1 hour)</p>
          </div>

          <div class="form-control">
            <label class="form-label">Show Real-time Indicator</label>
            <input type="checkbox" class="toggle toggle-primary" x-model="prefs.showRealtime" />
          </div>

          <div class="form-control">
            <label class="form-label">Animate Charts</label>
            <input type="checkbox" class="toggle toggle-primary" x-model="prefs.animateCharts" />
          </div>

          <div class="form-control">
            <label class="form-label">Cache Data (minutes)</label>
            <input type="number" class="form-input" x-model.number="prefs.cacheDuration" min="0" max="60" />
          </div>

          <div class="form-control">
            <label class="form-label">Theme</label>
            <select class="form-input" x-model="prefs.theme">
              <option value="bankxyz-light">Bank XYZ Light (Default)</option>
              <option value="bankxyz-dark">Bank XYZ Dark</option>
              <option value="auto">Auto (system)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Notifications -->
      <div class="card bg-base-100 shadow-md">
        <div class="card-body">
          <h3 class="card-title text-base">Notification Preferences</h3>

          <div class="form-control">
            <label class="form-label cursor-pointer flex items-center gap-2">
              <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" x-model="prefs.notify.flowFailed" />
              <span>ETL Flow Failed</span>
            </label>
          </div>

          <div class="form-control">
            <label class="form-label cursor-pointer flex items-center gap-2">
              <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" x-model="prefs.notify.slowQuery" />
              <span>Slow Query (&gt; 5s)</span>
            </label>
          </div>

          <div class="form-control">
            <label class="form-label cursor-pointer flex items-center gap-2">
              <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" x-model="prefs.notify.highErrorRate" />
              <span>High Error Rate (&gt; 5%)</span>
            </label>
          </div>

          <div class="form-control">
            <label class="form-label cursor-pointer flex items-center gap-2">
              <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" x-model="prefs.notify.dqScoreDrop" />
              <span>Data Quality Score Drop</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Display Columns -->
      <div class="card bg-base-100 shadow-md">
        <div class="card-body">
          <h3 class="card-title text-base">Visible Columns (ETL Jobs)</h3>
          <p class="text-sm text-gray-500 mb-3">Pilih kolom yang ditampilkan di ETL Jobs list</p>

          <div class="space-y-2">
            <template x-for="col in availableColumns" :key="col.key">
              <label class="flex cursor-pointer items-center gap-2 rounded-md p-2 hover:bg-base-200">
                <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" x-model="prefs.columns[col.key]" />
                <span class="text-sm" x-text="col.label"></span>
              </label>
            </template>
          </div>
        </div>
      </div>
    </div>

    <div class="card-actions justify-end mt-6">
      <button @click="reset()" class="btn btn-ghost">Reset to Default</button>
      <button @click="save()" class="btn btn-primary">Save Preferences</button>
    </div>

    <script type="module">
      function etlDisplayPage() {
        return {
          prefs: {
            pageSize: '20',
            sortOrder: 'desc',
            dateFormat: 'DD/MM/YYYY',
            timezone: 'Asia/Jakarta',
            numberFormat: 'id-ID',
            autoRefresh: 30,
            showRealtime: true,
            animateCharts: true,
            cacheDuration: 5,
            theme: 'bankxyz-light',
            notify: {
              flowFailed: true,
              slowQuery: true,
              highErrorRate: true,
              dqScoreDrop: false,
            },
            columns: {
              jobId: true,
              jobName: true,
              flow: true,
              source: true,
              target: true,
              status: true,
              recordsProcessed: true,
              duration: true,
              startedAt: true,
              finishedAt: true,
              errorMessage: true,
              triggeredBy: false,
            },
          },
          availableColumns: [
            { key: 'jobId', label: 'Job ID' },
            { key: 'jobName', label: 'Job Name' },
            { key: 'flow', label: 'NiFi Flow' },
            { key: 'source', label: 'Source System' },
            { key: 'target', label: 'Target' },
            { key: 'status', label: 'Status' },
            { key: 'recordsProcessed', label: 'Records Processed' },
            { key: 'duration', label: 'Duration' },
            { key: 'startedAt', label: 'Started At' },
            { key: 'finishedAt', label: 'Finished At' },
            { key: 'errorMessage', label: 'Error Message' },
            { key: 'triggeredBy', label: 'Triggered By' },
          ],

          async init() {
            // Load from localStorage
            const saved = localStorage.getItem('etlDisplayPrefs');
            if (saved) {
              try { this.prefs = { ...this.prefs, ...JSON.parse(saved) }; }
              catch (e) { console.error('Failed to load prefs:', e); }
            }
          },

          async save() {
            localStorage.setItem('etlDisplayPrefs', JSON.stringify(this.prefs));
            window.dispatchEvent(new CustomEvent('toast:show', { detail: { message: 'ETL display preferences saved', type: 'success' } }));
          },

          reset() {
            this.prefs = {
              pageSize: '20', sortOrder: 'desc', dateFormat: 'DD/MM/YYYY', timezone: 'Asia/Jakarta',
              numberFormat: 'id-ID', autoRefresh: 30, showRealtime: true, animateCharts: true, cacheDuration: 5,
              theme: 'bankxyz-light', notify: { flowFailed: true, slowQuery: true, highErrorRate: true, dqScoreDrop: false },
              columns: { jobId: true, jobName: true, flow: true, source: true, target: true, status: true, recordsProcessed: true, duration: true, startedAt: true, finishedAt: true, errorMessage: true, triggeredBy: false },
            };
            window.dispatchEvent(new CustomEvent('toast:show', { detail: { message: 'Preferences reset to default', type: 'info' } }));
          },
        };
      }

      window.etlDisplayPage = etlDisplayPage;
    </script>
  </body>
</html>
