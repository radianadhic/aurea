<!DOCTYPE html>
<html lang="id" data-theme="bankxyz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Health - MDM Admin</title>
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <body class="bg-base-200" x-data="healthPage()">
    <div class="mb-6">
      <h1 class="text-2xl font-bold">System Health Check</h1>
      <p class="text-sm text-gray-500">Run comprehensive 100-point health check across all components</p>
    </div>

    <!-- Health Score -->
    <div class="card mb-6 bg-base-100 shadow-md">
      <div class="card-body">
        <div class="flex items-center justify-between">
          <div>
            <h3 class="text-lg font-semibold">Overall Health Score</h3>
            <p class="text-sm text-gray-500">Last checked: <span x-text="lastCheck"></span></p>
          </div>
          <div class="text-right">
            <div class="text-5xl font-bold" :class="healthScore >= 90 ? 'text-success' : healthScore >= 70 ? 'text-warning' : 'text-error'" x-text="healthScore + '%'"></div>
            <button @click="runHealthCheck()" class="btn btn-primary btn-sm mt-2" :disabled="running">
              <span x-show="!running">Run Health Check</span>
              <span x-show="running" class="loading loading-spinner loading-sm"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Health Categories -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <template x-for="category in categories" :key="category.name">
        <div class="card bg-base-100 shadow-md">
          <div class="card-body">
            <div class="flex items-center justify-between">
              <h3 class="card-title text-base" x-text="category.name"></h3>
              <span class="badge" :class="category.score >= 90 ? 'badge-success' : category.score >= 70 ? 'badge-warning' : 'badge-error'" x-text="category.score + '%'"></span>
            </div>
            <progress class="progress mt-2" :class="category.score >= 90 ? 'progress-success' : category.score >= 70 ? 'progress-warning' : 'progress-error'" :value="category.score" max="100"></progress>
            <div class="mt-3 space-y-1 text-xs">
              <template x-for="check in category.checks" :key="check.name">
                <div class="flex items-center justify-between">
                  <span class="flex items-center gap-2">
                    <span :class="check.passed ? 'status-dot status-up' : 'status-dot status-down'"></span>
                    <span x-text="check.name"></span>
                  </span>
                  <span class="text-gray-500" x-text="check.duration + 'ms'"></span>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>

    <script type="module">
      function healthPage() {
        return {
          healthScore: 94,
          lastCheck: new Date().toLocaleString('id-ID'),
          running: false,
          categories: [
            { name: 'Database', score: 98, checks: [
              { name: 'PostgreSQL connection', passed: true, duration: 12 },
              { name: 'Replica lag < 5s', passed: true, duration: 5 },
              { name: 'Disk usage < 80%', passed: true, duration: 8 },
              { name: 'Connections < 80% pool', passed: true, duration: 3 },
              { name: 'Vacuum running', passed: true, duration: 7 },
            ]},
            { name: 'Cache (Valkey)', score: 100, checks: [
              { name: 'Master connection', passed: true, duration: 2 },
              { name: 'Replica connections (2)', passed: true, duration: 3 },
              { name: 'Memory usage < 70%', passed: true, duration: 4 },
              { name: 'Hit rate > 90%', passed: true, duration: 6 },
            ]},
            { name: 'Kafka', score: 95, checks: [
              { name: 'Brokers up (3/3)', passed: true, duration: 15 },
              { name: 'Consumer lag < 10K', passed: true, duration: 23 },
              { name: 'Under-replicated partitions = 0', passed: true, duration: 18 },
              { name: 'Disk usage < 70%', passed: true, duration: 12 },
              { name: 'All topics have min ISR', passed: true, duration: 8 },
            ]},
            { name: 'Services (13)', score: 92, checks: [
              { name: 'All services UP', passed: true, duration: 45 },
              { name: 'Response time < 200ms', passed: true, duration: 67 },
              { name: 'Error rate < 1%', passed: true, duration: 89 },
              { name: 'CPU usage < 80%', passed: false, duration: 234 },
              { name: 'Memory usage < 80%', passed: true, duration: 56 },
            ]},
            { name: 'Security', score: 96, checks: [
              { name: 'Keycloak realm accessible', passed: true, duration: 34 },
              { name: 'SSL certificates valid', passed: true, duration: 12 },
              { name: 'MFA enabled for admins', passed: true, duration: 8 },
              { name: 'No failed login spike', passed: true, duration: 23 },
              { name: 'Audit log active', passed: true, duration: 15 },
            ]},
            { name: 'Backup & DR', score: 90, checks: [
              { name: 'Last backup < 24h', passed: true, duration: 5 },
              { name: 'Backup size > 0', passed: true, duration: 3 },
              { name: 'DR replica in sync', passed: true, duration: 18 },
              { name: 'Restore tested < 30 days', passed: true, duration: 7 },
            ]},
          ],

          async runHealthCheck() {
            this.running = true;
            // TODO: Call /api/v1/admin/health-check
            setTimeout(() => {
              this.running = false;
              this.lastCheck = new Date().toLocaleString('id-ID');
            }, 2000);
          },
        };
      }

      window.healthPage = healthPage;
    </script>
  </body>
</html>
