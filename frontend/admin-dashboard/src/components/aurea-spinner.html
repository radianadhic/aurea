<!--
  AUREA Loading Spinner Component
  Usage: <div x-data="aureaSpinner()" x-show="loading">
           <div class="aurea-dots">
             <div class="aurea-dot"></div>
             <div class="aurea-dot"></div>
             <div class="aurea-dot"></div>
           </div>
           <p x-text="message"></p>
         </div>
-->
<div class="aurea-spinner-component" x-data="aureaSpinnerComponent()">
  <!-- MD3G Dots (default, brand-recognizable) -->
  <div class="aurea-dots" x-show="type === 'dots'">
    <div class="aurea-dot"></div>
    <div class="aurea-dot"></div>
    <div class="aurea-dot"></div>
  </div>

  <!-- Gold Ring -->
  <div class="aurea-ring" x-show="type === 'ring'"></div>

  <!-- Rotating A -->
  <div class="aurea-rotating-a" x-show="type === 'a'">A</div>

  <!-- Progress Bar (indeterminate) -->
  <div class="aurea-progress" x-show="type === 'bar'">
    <div class="aurea-progress-bar"></div>
  </div>

  <!-- AUREA Text Flicker -->
  <div class="aurea-text-flicker" x-show="type === 'text'">AUREA</div>

  <!-- Optional message -->
  <p class="aurea-spinner-message" x-show="message" x-text="message"></p>
</div>

<script>
function aureaSpinnerComponent() {
  return {
    type: 'dots',  // 'dots' | 'ring' | 'a' | 'bar' | 'text'
    message: '',

    init() {
      const ds = this.$el.dataset;
      if (ds.type) this.type = ds.type;
      if (ds.message) this.message = ds.message;
    }
  };
}
</script>

<style>
.aurea-spinner-component {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.aurea-spinner-message {
  color: #8FA5BD;
  font-size: 13px;
  letter-spacing: 2px;
  margin: 0;
}

/* === MD3G Dots === */
.aurea-dots {
  display: flex;
  gap: 10px;
}
.aurea-dot {
  width: 14px;
  height: 14px;
  background: #D4AF37;
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(212, 175, 55, 0.6);
  animation: aurea-dot-bounce 1.4s ease-in-out infinite;
}
.aurea-dot:nth-child(2) { animation-delay: 0.2s; }
.aurea-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes aurea-dot-bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1.2); opacity: 1; }
}

/* === Gold Ring === */
.aurea-ring {
  width: 40px;
  height: 40px;
  border: 3px solid rgba(212, 175, 55, 0.15);
  border-top-color: #D4AF37;
  border-right-color: #FFD764;
  border-radius: 50%;
  animation: aurea-rotate 0.9s linear infinite;
}
@keyframes aurea-rotate { to { transform: rotate(360deg); } }

/* === Rotating A === */
.aurea-rotating-a {
  width: 56px;
  height: 56px;
  background: conic-gradient(from 0deg, transparent 0%, #D4AF37 50%, transparent 100%);
  border-radius: 50%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: aurea-rotate 1.5s linear infinite;
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 26px;
  font-weight: 700;
  color: #D4AF37;
  mask: radial-gradient(circle, transparent 50%, black 51%);
  -webkit-mask: radial-gradient(circle, transparent 50%, black 51%);
}

/* === Progress Bar === */
.aurea-progress {
  width: 240px;
  height: 3px;
  background: rgba(212, 175, 55, 0.2);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.aurea-progress-bar {
  position: absolute;
  top: 0;
  left: -40%;
  width: 40%;
  height: 100%;
  background: linear-gradient(90deg, transparent, #FFD764, #D4AF37, transparent);
  border-radius: 3px;
  animation: aurea-bar-slide 1.5s ease-in-out infinite;
}
@keyframes aurea-bar-slide {
  0% { left: -40%; }
  100% { left: 100%; }
}

/* === AUREA Text Flicker === */
.aurea-text-flicker {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 6px;
  color: #D4AF37;
  animation: aurea-flicker 1.6s ease-in-out infinite;
}
@keyframes aurea-flicker {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; text-shadow: 0 0 16px rgba(212, 175, 55, 0.6); }
}
</style>
