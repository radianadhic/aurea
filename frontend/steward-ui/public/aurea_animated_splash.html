<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AUREA — Splash Screen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0A1929 0%, #1A2F47 100%);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* ===== AUREA Splash Screen ===== */
  .aurea-splash {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* === Logo Mark === */
  .aurea-mark {
    position: relative;
    width: 200px;
    height: 200px;
    margin-bottom: 30px;
  }

  .aurea-circle {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1A2F47 0%, #0A1929 100%);
    border-radius: 50%;
    box-shadow: 0 0 60px rgba(212, 175, 55, 0.3);
    animation: circleGlow 2.5s ease-in-out infinite;
  }

  @keyframes circleGlow {
    0%, 100% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.2); }
    50% { box-shadow: 0 0 80px rgba(212, 175, 55, 0.6); }
  }

  .aurea-letter {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* The "A" triangle (SVG-like via CSS) */
  .aurea-a {
    width: 0;
    height: 0;
    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
    border-bottom: 110px solid #D4AF37;
    position: relative;
    margin-top: -10px;
    filter: drop-shadow(0 4px 12px rgba(212, 175, 55, 0.4));
    animation: aDrop 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
  }

  /* Inner A (cutout illusion) */
  .aurea-a::before {
    content: '';
    position: absolute;
    top: 60px;
    left: -18px;
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-bottom: 35px solid #0A1929;
  }

  /* Bottom A bar */
  .aurea-a::after {
    content: '';
    position: absolute;
    top: 78px;
    left: -42px;
    width: 84px;
    height: 12px;
    background: #D4AF37;
    border-radius: 2px;
  }

  @keyframes aDrop {
    0% { transform: translateY(-50px) scale(0.5); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* === 3 Golden Dots (MD3G) === */
  .aurea-dots {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
  }

  .aurea-dot {
    width: 8px;
    height: 8px;
    background: #FFD764;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(255, 215, 100, 0.8);
    animation: dotPulse 1.5s ease-in-out infinite;
  }

  .aurea-dot:nth-child(2) { animation-delay: 0.2s; }
  .aurea-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.4); opacity: 1; }
  }

  /* === AUREA Text === */
  .aurea-text {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 56px;
    font-weight: 700;
    background: linear-gradient(135deg, #FFD764 0%, #D4AF37 50%, #B8860B 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 12px;
    margin-left: 12px; /* offset for letter-spacing */
    animation: textReveal 1s ease-out 0.6s both;
    position: relative;
  }

  @keyframes textReveal {
    0% { opacity: 0; letter-spacing: 30px; filter: blur(10px); }
    100% { opacity: 1; letter-spacing: 12px; filter: blur(0); }
  }

  /* Gold divider line */
  .aurea-divider {
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, #D4AF37 50%, transparent 100%);
    margin: 16px 0;
    animation: dividerExpand 0.8s ease-out 1.2s both;
  }

  @keyframes dividerExpand {
    0% { width: 0; }
    100% { width: 400px; }
  }

  /* === Tagline === */
  .aurea-tagline {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    color: #8FA5BD;
    letter-spacing: 6px;
    margin-left: 6px;
    opacity: 0;
    animation: taglineFade 1s ease-out 1.5s both;
  }

  @keyframes taglineFade {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* === Loading bar === */
  .aurea-loader {
    margin-top: 40px;
    width: 200px;
    height: 3px;
    background: rgba(212, 175, 55, 0.2);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }

  .aurea-loader::before {
    content: '';
    position: absolute;
    top: 0;
    left: -50%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, #D4AF37, transparent);
    border-radius: 3px;
    animation: loaderSlide 1.8s ease-in-out infinite;
  }

  @keyframes loaderSlide {
    0% { left: -50%; }
    100% { left: 100%; }
  }

  /* === Version label === */
  .aurea-version {
    position: absolute;
    bottom: 30px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px;
    color: #4A6580;
    letter-spacing: 2px;
    opacity: 0;
    animation: versionFade 1s ease-out 2s both;
  }

  @keyframes versionFade {
    0% { opacity: 0; }
    100% { opacity: 0.7; }
  }

  /* === Particle background === */
  .aurea-particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #D4AF37;
    border-radius: 50%;
    opacity: 0;
    animation: particleFloat 6s linear infinite;
  }

  @keyframes particleFloat {
    0% {
      opacity: 0;
      transform: translateY(100vh) translateX(0);
    }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% {
      opacity: 0;
      transform: translateY(-10vh) translateX(var(--drift, 50px));
    }
  }
</style>
</head>
<body>

  <!-- Particles -->
  <div class="aurea-particle" style="left: 10%; animation-delay: 0s; --drift: 30px;"></div>
  <div class="aurea-particle" style="left: 20%; animation-delay: 1.2s; --drift: -20px;"></div>
  <div class="aurea-particle" style="left: 35%; animation-delay: 2.5s; --drift: 40px;"></div>
  <div class="aurea-particle" style="left: 50%; animation-delay: 0.8s; --drift: -30px;"></div>
  <div class="aurea-particle" style="left: 65%; animation-delay: 3.2s; --drift: 25px;"></div>
  <div class="aurea-particle" style="left: 80%; animation-delay: 1.8s; --drift: -40px;"></div>
  <div class="aurea-particle" style="left: 90%; animation-delay: 4.1s; --drift: 35px;"></div>

  <!-- AUREA Splash -->
  <div class="aurea-splash">

    <!-- Logo Mark -->
    <div class="aurea-mark">
      <div class="aurea-circle"></div>
      <div class="aurea-letter">
        <div class="aurea-a"></div>
      </div>
      <div class="aurea-dots">
        <div class="aurea-dot"></div>
        <div class="aurea-dot"></div>
        <div class="aurea-dot"></div>
      </div>
    </div>

    <!-- Brand Text -->
    <div class="aurea-text">AUREA</div>
    <div class="aurea-divider"></div>
    <div class="aurea-tagline">THE GOLD STANDARD OF DATA</div>

    <!-- Loading Bar -->
    <div class="aurea-loader"></div>
  </div>

  <!-- Version -->
  <div class="aurea-version">v1.0 • 2026</div>

  <script>
    // After 3 seconds, hide splash and show "ready" state
    setTimeout(() => {
      const loader = document.querySelector('.aurea-loader');
      loader.style.background = '#D4AF37';
      loader.style.transition = 'background 0.3s';
    }, 3000);
  </script>
</body>
</html>
