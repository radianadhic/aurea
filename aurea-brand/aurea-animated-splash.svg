<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1929"/>
      <stop offset="100%" stop-color="#1A2F47"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD764"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <radialGradient id="innerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE5A0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- Floating particles (animated) -->
  <g opacity="0.5">
    <circle cx="100" cy="500" r="2" fill="#D4AF37">
      <animate attributeName="cy" values="500;50" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="500" r="3" fill="#FFD764">
      <animate attributeName="cy" values="500;50" dur="7s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" dur="7s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="500" r="2" fill="#D4AF37">
      <animate attributeName="cy" values="500;50" dur="8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" dur="8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="500" r="2" fill="#FFD764">
      <animate attributeName="cy" values="500;50" dur="6.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" dur="6.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="500" r="3" fill="#D4AF37">
      <animate attributeName="cy" values="500;50" dur="7.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" dur="7.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Outer ring (pulsing) -->
  <circle cx="300" cy="280" r="120" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0">
    <animate attributeName="r" values="120;180" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="300" cy="280" r="120" fill="none" stroke="#FFD764" stroke-width="1" opacity="0">
    <animate attributeName="r" values="120;180" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;0.5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Main circle (logo background) -->
  <circle cx="300" cy="280" r="120" fill="#0A1929" stroke="#1A2F47" stroke-width="2">
    <animate attributeName="r" values="0;120" dur="0.8s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
  </circle>

  <!-- Inner glow -->
  <circle cx="300" cy="280" r="115" fill="url(#innerGlow)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.4s" fill="freeze"/>
  </circle>

  <!-- A triangle (drops in) -->
  <g filter="url(#goldGlow)">
    <path d="M 300 195 L 365 350 L 340 350 L 322 315 L 278 315 L 260 350 L 235 350 Z"
          fill="url(#goldGrad)" transform="translate(0, -50)">
      <animateTransform attributeName="transform" type="translate"
                        values="0,-50; 0,0" dur="0.8s" begin="0.5s" fill="freeze"
                        calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
    </path>
  </g>

  <!-- A inner cutout -->
  <path d="M 285 295 L 315 295 L 308 280 L 292 280 Z" fill="#0A1929" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
  </path>

  <!-- A bottom bar -->
  <rect x="268" y="305" width="64" height="10" fill="url(#goldGrad)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>
  </rect>

  <!-- 3 Golden Dots (pulse) -->
  <g>
    <circle cx="270" cy="335" r="4" fill="#FFD764" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/>
      <animate attributeName="r" values="3;5;3" dur="2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="335" r="4" fill="#FFD764" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>
      <animate attributeName="r" values="3;5;3" dur="2s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="335" r="4" fill="#FFD764" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
      <animate attributeName="r" values="3;5;3" dur="2s" begin="2.0s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- AUREA Text (reveals letter by letter) -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="10">
    <text x="140" y="470" fill="url(#goldGrad)" opacity="0">
      A
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.6s" fill="freeze"/>
    </text>
    <text x="220" y="470" fill="url(#goldGrad)" opacity="0">
      U
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.75s" fill="freeze"/>
    </text>
    <text x="305" y="470" fill="url(#goldGrad)" opacity="0">
      R
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.9s" fill="freeze"/>
    </text>
    <text x="385" y="470" fill="url(#goldGrad)" opacity="0">
      E
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.05s" fill="freeze"/>
    </text>
    <text x="460" y="470" fill="url(#goldGrad)" opacity="0">
      A
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.2s" fill="freeze"/>
    </text>
  </g>

  <!-- Divider line (expands from center) -->
  <line x1="300" y1="490" x2="300" y2="490" stroke="#D4AF37" stroke-width="2" opacity="0.8">
    <animate attributeName="x1" values="300;100" dur="0.6s" begin="2.5s" fill="freeze"/>
    <animate attributeName="x2" values="300;500" dur="0.6s" begin="2.5s" fill="freeze"/>
  </line>

  <!-- Tagline -->
  <text x="300" y="520" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8FA5BD" letter-spacing="6" text-anchor="middle" opacity="0">
    THE GOLD STANDARD OF DATA
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2.9s" fill="freeze"/>
  </text>

  <!-- Loading bar -->
  <rect x="200" y="550" width="200" height="3" fill="rgba(212, 175, 55, 0.2)" rx="1.5" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.2s" fill="freeze"/>
  </rect>
  <rect x="200" y="550" width="0" height="3" fill="url(#goldGrad)" rx="1.5" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.2s" fill="freeze"/>
    <animate attributeName="width" values="0;200" dur="2.5s" begin="3.4s" fill="freeze"/>
  </rect>
</svg>
