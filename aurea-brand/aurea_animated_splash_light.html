<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AUREA — Light Mode Splash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #F5F5F5 0%, #FFFFFF 50%, #FAF8F0 100%);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .aurea-splash { position: relative; display: flex; flex-direction: column; align-items: center; }

  .aurea-mark { position: relative; width: 200px; height: 200px; margin-bottom: 30px; }

  .aurea-circle {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #FFFFFF 0%, #F0EAD6 100%);
    border-radius: 50%;
    box-shadow: 0 8px 40px rgba(184, 134, 11, 0.25), inset 0 2px 8px rgba(212, 175, 55, 0.15);
    border: 2px solid rgba(212, 175, 55, 0.3);
    animation: circleGlow 2.5s ease-in-out infinite;
  }
  @keyframes circleGlow {
    0%, 100% { box-shadow: 0 8px 30px rgba(184, 134, 11, 0.2), inset 0 2px 8px rgba(212, 175, 55, 0.15); }
    50% { box-shadow: 0 8px 60px rgba(184, 134, 11, 0.4), inset 0 2px 12px rgba(212, 175, 55, 0.25); }
  }

  .aurea-letter { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

  .aurea-a {
    width: 0; height: 0;
    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
    border-bottom: 110px solid #D4AF37;
    position: relative; margin-top: -10px;
    filter: drop-shadow(0 4px 12px rgba(184, 134, 11, 0.5));
    animation: aDrop 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
  }
  .aurea-a::before {
    content: ''; position: absolute; top: 60px; left: -18px;
    width: 0; height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-bottom: 35px solid #FFFFFF;
  }
  .aurea-a::after {
    content: ''; position: absolute; top: 78px; left: -42px;
    width: 84px; height: 12px;
    background: #D4AF37; border-radius: 2px;
    box-shadow: 0 2px 4px rgba(184, 134, 11, 0.4);
  }
  @keyframes aDrop {
    0% { transform: translateY(-50px) scale(0.5); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  .aurea-dots {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px;
  }
  .aurea-dot {
    width: 8px; height: 8px;
    background: #B8860B; border-radius: 50%;
    box-shadow: 0 0 12px rgba(184, 134, 11, 0.6);
    animation: dotPulse 1.5s ease-in-out infinite;
  }
  .aurea-dot:nth-child(2) { animation-delay: 0.2s; }
  .aurea-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.4); opacity: 1; }
  }

  .aurea-text {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 56px; font-weight: 700;
    background: linear-gradient(135deg, #FFD764 0%, #D4AF37 50%, #B8860B 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 12px; margin-left: 12px;
    animation: textReveal 1s ease-out 0.6s both;
  }
  @keyframes textReveal {
    0% { opacity: 0; letter-spacing: 30px; filter: blur(10px); }
    100% { opacity: 1; letter-spacing: 12px; filter: blur(0); }
  }

  .aurea-divider {
    width: 0; height: 2px;
    background: linear-gradient(90deg, transparent 0%, #D4AF37 50%, transparent 100%);
    margin: 16px 0;
    animation: dividerExpand 0.8s ease-out 1.2s both;
  }
  @keyframes dividerExpand { 0% { width: 0; } 100% { width: 400px; } }

  .aurea-tagline {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px; color: #666; letter-spacing: 6px; margin-left: 6px;
    opacity: 0;
    animation: taglineFade 1s ease-out 1.5s both;
  }
  @keyframes taglineFade {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .aurea-loader {
    margin-top: 40px; width: 200px; height: 3px;
    background: rgba(184, 134, 11, 0.2);
    border-radius: 3px; overflow: hidden; position: relative;
  }
  .aurea-loader::before {
    content: ''; position: absolute; top: 0; left: -50%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, #D4AF37, transparent);
    border-radius: 3px;
    animation: loaderSlide 1.8s ease-in-out infinite;
  }
  @keyframes loaderSlide {
    0% { left: -50%; } 100% { left: 100%; }
  }

  .aurea-version {
    position: absolute; bottom: 30px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px; color: #999; letter-spacing: 2px;
    opacity: 0;
    animation: versionFade 1s ease-out 2s both;
  }
  @keyframes versionFade { 0% { opacity: 0; } 100% { opacity: 0.7; } }
</style>
</head>
<body>
  <div class="aurea-splash">
    <div class="aurea-mark">
      <div class="aurea-circle"></div>
      <div class="aurea-letter"><div class="aurea-a"></div></div>
      <div class="aurea-dots">
        <div class="aurea-dot"></div><div class="aurea-dot"></div><div class="aurea-dot"></div>
      </div>
    </div>
    <div class="aurea-text">AUREA</div>
    <div class="aurea-divider"></div>
    <div class="aurea-tagline">THE GOLD STANDARD OF DATA</div>
    <div class="aurea-loader"></div>
  </div>
  <div class="aurea-version">v1.0 • 2026</div>
</body>
</html>
