# Customer Service - K8s deployment (similar to auth-service but higher replicas)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: mdm
  labels:
    app: customer-service
    version: 1.0.0
    tier: backend
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
        version: 1.0.0
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: customer-service
          image: bankxyz/mdm-customer-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SERVER_PORT
              value: "8082"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: mdm-secrets
                  key: customer-db-url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mdm-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mdm-secrets
                  key: customer-db-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka-system:9092"
            - name: REDIS_HOST
              value: "valkey.cache-system"
            - name: KEYCLOAK_ISSUER_URI
              value: "https://keycloak.mdm.bankxyz.co.id/realms/mdm-prod"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: mdm
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: 8082
  selector:
    app: customer-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-service
  namespace: mdm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-service
  minReplicas: 5
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: customer-service
  namespace: mdm
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: customer-service
