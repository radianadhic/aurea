apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production Kustomize overlay for all MDM services.
# Includes: HPA, PDB, NetworkPolicy, ServiceMonitor, PodDisruptionBudget.

namespace: mdm-prod

resources:
  - ../../base/auth-service
  - ../../base/customer-service
  - ../../base/api-gateway
  - ../../base/matching-service
  - ../../base/audit-service
  - ../../base/notification-service
  - ../../base/workflow-service
  - ../../base/ml-service
  - ../../base/steward-ui
  - ../../base/customer360-ui
  - postgres
  - redis
  - kafka
  - keycloak
  - monitoring
  - ingress
  - network-policies

commonLabels:
  env: production
  managed-by: argocd
  project: mdm-bankxyz
