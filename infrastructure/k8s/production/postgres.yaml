apiVersion: v1
kind: Secret
metadata:
  name: mdm-db-secrets
  namespace: mdm-prod
type: Opaque
stringData:
  host: postgres-primary.mdm-prod
  username: mdm
  password: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: mdm-redis-secrets
  namespace: mdm-prod
type: Opaque
stringData:
  password: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: mdm-keycloak-secrets
  namespace: mdm-prod
type: Opaque
stringData:
  admin-password: REPLACE_ME
  client-secret: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: mdm-jwt-secrets
  namespace: mdm-prod
type: Opaque
stringData:
  secret: REPLACE_ME_BASE64
---
apiVersion: v1
kind: Secret
metadata:
  name: mdm-kafka-secrets
  namespace: mdm-prod
type: Opaque
stringData:
  sasl-password: REPLACE_ME
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: mdm-prod
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: backend
      ports:
        - port: 5432
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres
  namespace: mdm-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: postgres
