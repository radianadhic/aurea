# Prometheus configuration for MDM
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s
  external_labels:
    cluster: mdm-prod
    region: ap-southeast-3

# Load rules
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Scrape configs
scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Kubernetes pods
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: (.+)
        replacement: ${1}
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: replace
        target_label: service

  # PostgreSQL
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Kafka
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Redis
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Node (host metrics)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
