# Grafana Dashboard ConfigMap for MDM
apiVersion: v1
kind: ConfigMap
metadata:
  name: mdm-dashboard-config
  namespace: mdm
  labels:
    grafana_dashboard: "1"
data:
  mdm-overview.json: |
    {
      "title": "MDM Bank XYZ - Overview",
      "uid": "mdm-overview",
      "tags": ["mdm", "bank-xyz"],
      "timezone": "Asia/Jakarta",
      "refresh": "30s",
      "panels": [
        {
          "title": "Service Health (UP/DOWN)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum by (service) (up{namespace=\"mdm\"})",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "title": "Request Rate (req/sec)",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {
              "expr": "sum by (service) (rate(http_server_requests_seconds_count{namespace=\"mdm\"}[5m]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "title": "Response Time p50/p95/p99",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, service) (rate(http_server_requests_seconds_bucket{namespace=\"mdm\"}[5m])))",
              "legendFormat": "p50 {{service}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(http_server_requests_seconds_bucket{namespace=\"mdm\"}[5m])))",
              "legendFormat": "p95 {{service}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le, service) (rate(http_server_requests_seconds_bucket{namespace=\"mdm\"}[5m])))",
              "legendFormat": "p99 {{service}}"
            }
          ]
        },
        {
          "title": "CPU Usage by Pod",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"mdm\"}[5m])) * 100",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "title": "Memory Usage by Pod",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_usage_bytes{namespace=\"mdm\"}) / 1024 / 1024",
              "legendFormat": "{{pod}} MB"
            }
          ]
        },
        {
          "title": "Database Connections",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "targets": [
            {
              "expr": "sum by (instance) (hikaricp_connections_active{namespace=\"mdm\"})",
              "legendFormat": "{{instance}} active"
            },
            {
              "expr": "sum by (instance) (hikaricp_connections_idle{namespace=\"mdm\"})",
              "legendFormat": "{{instance}} idle"
            }
          ]
        },
        {
          "title": "Kafka Consumer Lag",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "targets": [
            {
              "expr": "sum by (topic, consumergroup) (kafka_consumer_lag{namespace=\"mdm\"})",
              "legendFormat": "{{topic}}/{{consumergroup}}"
            }
          ]
        }
      ]
    }
